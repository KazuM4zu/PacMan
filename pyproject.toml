[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.3.3",
    "flake8>=7.3.0",
    "mazegenerator",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pyinstaller>=6.21.0",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-00001-py3-none-any.whl" }

[tool.mypy]
disable_error_code = ["import-untyped", "import-not-found"]
